name: Deploy Backend to PythonAnywhere

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Nettoyer les consoles, effectuer le git pull et recharger le serveur Web
        env:
          PA_USER: ${{ secrets.PA_USERNAME }}
          PA_TOKEN: ${{ secrets.PA_API_TOKEN }}
          PA_DOMAIN: ${{ secrets.PA_DOMAIN }}
        run: |
          echo "=== 1. FERMETURE DE TOUTES LES CONSOLES ACTIVES ==="
          CONSOLES_JSON=$(curl -s -X GET "https://www.pythonanywhere.com/api/v0/user/${PA_USER}/consoles/" \
            -H "Authorization: Token ${PA_TOKEN}")
          
          # Extraction et suppression de chaque console ouverte
          CONSOLE_IDS=$(echo "$CONSOLES_JSON" | jq -r '.[].id // empty')
          for ID in $CONSOLE_IDS; do
            echo "Fermeture de la console ID: $ID"
            curl -s -X DELETE "https://www.pythonanywhere.com/api/v0/user/${PA_USER}/consoles/${ID}/" \
              -H "Authorization: Token ${PA_TOKEN}"
          done

          echo "=== 2. TENTATIVE DE GIT PULL VIA CONSOLE TEMPORAIRE ==="
          NEW_CONSOLE_RESP=$(curl -s -X POST "https://www.pythonanywhere.com/api/v0/user/${PA_USER}/consoles/" \
            -H "Authorization: Token ${PA_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"executable": "bin/bash"}')

          NEW_CONSOLE_ID=$(echo "$NEW_CONSOLE_RESP" | jq -r '.id // empty')

          if [ -n "$NEW_CONSOLE_ID" ]; then
            echo "Console $NEW_CONSOLE_ID créée avec succès. Envoi de git pull..."
            curl -s -X POST "https://www.pythonanywhere.com/api/v0/user/${PA_USER}/consoles/${NEW_CONSOLE_ID}/send_input/" \
              -H "Authorization: Token ${PA_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{"input": "cd ~/portfolio && git pull\n"}'
            
            sleep 5

            echo "Fermeture de la console temporaire $NEW_CONSOLE_ID..."
            curl -s -X DELETE "https://www.pythonanywhere.com/api/v0/user/${PA_USER}/consoles/${NEW_CONSOLE_ID}/" \
              -H "Authorization: Token ${PA_TOKEN}"
          else
            echo "Échec de création de la console. Le WSGI prendra le relais lors du reload."
          fi

          echo "=== 3. RECHARGEMENT DU SERVEUR WEB ==="
          RELOAD_RESP=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://www.pythonanywhere.com/api/v0/user/${PA_USER}/webapps/${PA_DOMAIN}/reload/" \
            -H "Authorization: Token ${PA_TOKEN}")

          if [ "$RELOAD_RESP" -eq 200 ] || [ "$RELOAD_RESP" -eq 201 ]; then
            echo "Serveur Web rechargé avec succès (Code $RELOAD_RESP)."
          else
            echo "Erreur lors du rechargement du serveur Web (Code $RELOAD_RESP)."
            exit 1
          fi
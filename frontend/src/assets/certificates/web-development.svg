<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="metaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="goldSeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="metaBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0668E1"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#metaBg)" rx="12"/>
  <rect width="800" height="500" fill="url(#grid)" rx="12"/>

  <!-- Ornate Certificate Frame -->
  <rect x="20" y="20" width="760" height="460" rx="8" fill="none" stroke="rgba(124, 58, 237, 0.3)" stroke-width="1.5"/>
  <rect x="30" y="30" width="740" height="440" rx="6" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- Top Banner / Meta Header -->
  <g transform="translate(60, 65)">
    <rect x="0" y="0" width="90" height="28" rx="6" fill="url(#metaBlue)"/>
    <text x="45" y="19" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.5">META</text>
    <text x="105" y="20" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="12" letter-spacing="2">CERTIFIED PROFESSIONAL</text>
  </g>

  <!-- Certificate Title -->
  <text x="60" y="160" fill="#71717a" font-family="monospace" font-size="12" letter-spacing="3">OFFICIAL CERTIFICATE OF COMPLETION</text>
  <text x="60" y="205" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.5">Full-Stack Web Development</text>
  <text x="60" y="235" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="18" font-weight="500">React, TypeScript, REST APIs &amp; Django Architecture</text>

  <!-- Divider -->
  <line x1="60" y1="265" x2="740" y2="265" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Certificate Info -->
  <text x="60" y="305" fill="#71717a" font-family="monospace" font-size="11">DÉCERNÉ À</text>
  <text x="60" y="330" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Jhirel Dev</text>

  <text x="260" y="305" fill="#71717a" font-family="monospace" font-size="11">DATE D'OBTENTION</text>
  <text x="260" y="330" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="15" font-weight="500">Mars 2024</text>

  <text x="440" y="305" fill="#71717a" font-family="monospace" font-size="11">IDENTIFIANT ACCRÉDITATION</text>
  <text x="440" y="330" fill="#c4b5fd" font-family="monospace" font-size="14" font-weight="600">META-FS-98214</text>

  <!-- Security Seal -->
  <g transform="translate(670, 370)">
    <circle cx="0" cy="0" r="46" fill="url(#goldSeal)" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.5))"/>
    <circle cx="0" cy="0" r="41" fill="none" stroke="#fef08a" stroke-width="1.5" stroke-dasharray="4 2"/>
    <circle cx="0" cy="0" r="36" fill="#1e1b4b"/>
    <text x="0" y="-8" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle" letter-spacing="1">VERIFIED</text>
    <text x="0" y="8" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">META</text>
    <text x="0" y="20" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="7" font-weight="600" text-anchor="middle">AUTHORIZED</text>
  </g>

  <!-- Bottom Details -->
  <text x="60" y="440" fill="#52525b" font-family="monospace" font-size="10">Secured cryptographic verification hash: sha256:7f83b1657ff1fc53b92dc18148a1d65dfc2d4b1fa3d677284addd200126d9069</text>
</svg>
